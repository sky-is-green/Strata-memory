[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-memory"
version = "0.1.0"
description = "Strata Memory — an external, multi-agent context-curation layer for long-horizon LLM conversations (HiveBench evaluation suite: sibling repo sky-is-green/hivebench)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "huggingface_hub>=0.23",
    "zstandard>=0.22",
    "tiktoken>=0.7.0",
    "sentence-transformers>=2.2.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
]

# Package layout: single root, flat import names preserved —
#   strata/ -> cortex, sieve, membrane, retention, focal, backend, auditor,
#             locations, logs (strata.__init__ is the public facade).
# The HiveBench Studio sidecar and the evaluation suite (tests/testing/
# experiments) live in the sibling repo sky-is-green/hivebench.

[tool.setuptools.packages.find]
where = ["strata"]
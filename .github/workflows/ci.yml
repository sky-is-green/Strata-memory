name: CI

on:
  push:
    branches: [StrataMemory-test]
  pull_request:

# The evaluation suite (unit/integration) moved to the sibling hivebench repo;
# this CI proves the system package itself installs clean and its facade
# imports in a fresh environment.
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU-only torch keeps the install lean (default wheels pull CUDA)
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e .

      - name: Smoke test (facade import)
        run: python -c "from strata import Strata, StrataConfig, UltraSmallDrone, LMStudioBackend; print('strata facade OK')"
